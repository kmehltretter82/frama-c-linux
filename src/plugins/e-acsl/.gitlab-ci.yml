stages:
 - build
 - tests

E-ACSL:
  stage: build
  variables:
    CURRENT: $CI_COMMIT_REF_NAME
    DEFAULT: "test-nix"
    OCAML: "4_05"
    FRAMA_CI_OPT: "--override e-acsl:$CI_COMMIT_REF_NAME,$CI_COMMIT_SHA"
  script:
   - nix/frama-ci.sh build -A e-acsl.installed
  tags:
   - nix

Tests:
  stage: tests
  variables:
    CURRENT: $CI_COMMIT_REF_NAME
    DEFAULT: "test-nix"
    OCAML: "4_05"
    FRAMA_CI_OPT: "--override e-acsl:$CI_COMMIT_REF_NAME,$CI_COMMIT_SHA"
  script:
   - nix/frama-ci.sh build -A e-acsl.tests
  tags:
   - nix

Cfp:
  stage: tests
  variables:
    CURRENT: $CI_COMMIT_REF_NAME
    DEFAULT: "test-nix"
    OCAML: "4_05"
    FRAMA_CI_OPT: "--override e-acsl:$CI_COMMIT_REF_NAME,$CI_COMMIT_SHA"
  script:
   - nix/frama-ci.sh build -A context-from-precondition.tests
  tags:
   - nix

Security:
  stage: tests
  variables:
    CURRENT: $CI_COMMIT_REF_NAME
    DEFAULT: "test-nix"
    OCAML: "4_05"
    FRAMA_CI_OPT: "--override e-acsl:$CI_COMMIT_REF_NAME,$CI_COMMIT_SHA"
  script:
   - nix/frama-ci.sh build -A security.tests
  tags:
   - nix
