  tags:
   - nix

acsl-importer:
  stage: tests
  variables:
    OCAML: "4_05"
  script:
   - nix/frama-ci.sh build -A acsl-importer.tests
  tags:
   - nix

volatile:
  stage: tests
  variables:
    OCAML: "4_05"
  script:
   - nix/frama-ci.sh build -A volatile.tests
  tags:
   - nix

Security:
  stage: tests
  variables:
    OCAML: "4_05"
  script:
   - nix/frama-ci.sh build -A security.tests
  tags:
   - nix

CFP:
  stage: tests
  variables:
    OCAML: "4_05"
  script:
   - nix/frama-ci.sh build -A context-from-precondition.tests
  tags:
