################################################################################
### STAGES

stages:
  - prepare
  - build
  - tests
  - distrib
  - compatibility
  - make_public

################################################################################
### DEFAULT JOB PARAMETERS

default:
  interruptible: true
  tags: [ nix ]

################################################################################
### VARIABLES

variables:
  DEFAULT: "feature/bobot/jbuilder"
  OCAML: "4_11"

################################################################################
### PREPARE

check-no-old-frama-c:
  stage: prepare
  script:
    - (! git merge-base --is-ancestor a1e186c68a6418a53b3dc06237f49e8dcbf75f4a HEAD)
    - git merge-base --is-ancestor a35d2118fe6999dddce9e1847eff626fae9cc37c HEAD

.build_template: &do_not_interrupt_template
  stage: prepare
  interruptible: false
  script:
    - echo "This pipeline won't be interrupted"

automatic-do-not-interrupt:
  <<: *do_not_interrupt_template
  only:
    variables:
      - $DEFAULT == $CI_COMMIT_BRANCH

manual-do-not-interrupt:
  <<: *do_not_interrupt_template
  when: manual
  except:
    variables:
      - $DEFAULT == $CI_COMMIT_BRANCH

################################################################################
### BUILD

frama-c:
  stage: build
  script:
    - ./nix/build-proxy.sh frama-c
  artifacts:
    when: on_failure
    paths:
      - commits.nix
      - results.log
    expire_in: 1 day

ivette:
  stage: build
  image: node:lts-gallium
  cache:
    paths:
      - ivette/node_modules/
  script:
    - node --version
    - npm --version
    - yarn --version
    - make -C ivette
  tags:
    - docker

################################################################################
### TESTS

acsl-importer:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh ACSL-importer

caveat-importer:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh Caveat-importer

cfp:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh context-from-precondition

e-acsl-tests:
  stage: tests
  script:
    - ./nix/build-proxy.sh e-acsl-tests

.build_template: &eva_template
  stage: tests
  script:
    - ./nix/build-proxy.sh eva-$CONFIG-tests

eva-default-tests:
  variables:
    CONFIG: "default"
  <<: *eva_template

eva-domains:
  <<: *eva_template
  parallel:
    matrix:
      - CONFIG: ["bitwise","equality","gauges","multidim","octagon","symblocs"]

frama-clang:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh frama-clang

genassigns:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh genassigns

kernel-tests:
  stage: tests
  script:
    - ./nix/build-proxy.sh kernel-tests

linea-cabs:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh linea-cabs

metacsl:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh meta

mthread:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh mthread

plugins-tests:
  stage: tests
  script:
    - ./nix/build-proxy.sh plugins-tests

security:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh security

volatile:
  stage: tests
  script:
    - ./nix/external-plugin-ci.sh Volatile

wp-tests:
  stage: tests
  script:
    - ./nix/build-proxy.sh wp-tests

################################################################################
### DISTRIB

# API documentation

.build_template: &api_doc_template
  stage: distrib
  script:
    - nix-build -o api nix/pkgs.nix -A ocaml-ng.ocamlPackages_$OCAML.api-doc

api-doc-default: # Check that we successfully build but no artifact
  <<: *api_doc_template

api-doc-artifact: # Note: the Nix store avoids rebuilding
  <<: *api_doc_template
  artifacts:
    paths:
      - api/frama-c-api.tar.gz
    expire_in: 7 days
  when: manual

api-doc-scheduled: # Keep artifact for master branch each night
  <<: *api_doc_template
  artifacts:
    paths:
      - api/frama-c-api.tar.gz
    expire_in: 7 days # Note: the LAST artifact of the ref is always kept
  only:
    - schedules

# Build distribution tarball

build-distrib-tarball:
  stage: distrib
  variables:
    OPEN_SOURCE: "yes"
    CI_LINK: "yes"
    HDRCK: "frama-c-hdrck"
  script:
    - ./nix/shell-checkers.sh "autoconf && ./dev/make-distrib.sh"
  artifacts:
    paths:
      - ./*.tar.gz
    expire_in: 1 week

# Check files header

header-check:
  stage: distrib
  variables:
    FRAMAC_HDRCK: ""
  script:
    - ./nix/shell-checkers.sh "make -f share/Makefile.headers check-headers"

# Lint files

lint:
  stage: distrib
  variables:
    LINT_MAKEFILE: "share/Makefile.linting"
  script:
    - ./nix/shell-checkers.sh "make -f share/Makefile.linting lint"

# Manuals

.build_template: &manuals_template
  stage: distrib
  script:
    - nix-build -o manuals nix/pkgs.nix -A ocaml-ng.ocamlPackages_$OCAML.manuals

manuals:
  <<: *manuals_template
  when: manual
  artifacts:
    paths:
      - manuals/*.pdf
      - manuals/*.tgz
    expire_in: 7 days # Note: the LAST artifact of the ref is always kept

################################################################################
### COMPATIBILITY

# Internalized plugins tests

.build_template: &internal_template
  stage: compatibility
  script:
    - ./nix/internal-tests.sh

internal:
  <<: *internal_template
  when: manual

internal_nightly:
  <<: *internal_template
  only:
    - schedules

# OCaml versions

ocaml-versions:
  stage: compatibility
  script:
    - ./nix/build-proxy.sh default-config-tests
  parallel:
    matrix:
      - OCAML: ["4_08", "4_13"]
  when: manual

# Opam pin

.build_template: &opam_template
  stage: compatibility
  image: 'ocaml/opam:ubuntu-20.04-ocaml-4.08'
  script:
    - opam pin . -n
    - opam depext frama-c --with-test
    - opam install --jobs 2 frama-c --with-test
  tags:
    - docker

opam-pin:
  <<: *opam_template
  when: manual

opam-pin-nightly:
  <<: *opam_template
  only:
    - schedules
  allow_failure: true

# TODO: Enable this rule later:
