build-distrib-tarball:
  stage: build
  variables:
    OCAML: "4_05"
  script:
   - nix/frama-ci.sh build -A frama-c.build-distrib-tarball
  tags:
   - nix

build-from-distrib-tarball:
  stage: tests
  variables:
    OCAML: "4_05"
  script:
   - nix/frama-ci.sh build -A frama-c.build-from-distrib-tarball
  tags:
   - nix

.build_template: &internal_template
  stage: distrib_and_compatibility
  variables:
    OCAML: "4_05"
  tags:
   - nix

internal:
  <<: *internal_template
  script:
   - nix/frama-ci.sh build -A frama-c.internal
  when: manual


internal_nightly:
  <<: *internal_template
  script:
   - nix/frama-ci.sh build -A frama-c.internal
  only:
  - schedules


.build_template: &frama-c-ocaml
  stage: distrib_and_compatibility
  script:
   - nix/frama-ci.sh build -A frama-c.tests
  tags:
   - nix

frama-c-ocaml-4.06:
  variables:
    OCAML: "4_06"
  <<: *frama-c-ocaml
  only:
  - schedules

frama-c-ocaml-4.07:
  variables:
    OCAML: "4_07"
  <<: *frama-c-ocaml

#frama-c-ocaml-4.08:
#  variables:
#    OCAML: "4_08"
#  <<: *frama-c-ocaml


caveat-importer:
  stage: tests
  variables:
    OCAML: "4_05"
  script:
   - nix/frama-ci.sh build -A caveat-importer.tests
  tags:
